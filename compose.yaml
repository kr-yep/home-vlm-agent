# Run from WSL:  docker compose up -d vlm app proxy   → http://127.0.0.1:8700
# Weights and media come from /root/.cache/home-vlm (see README).
# `--profile bench` adds vLLM, llama.cpp with the 12B, Ollama, SGLang, mistral.rs and TabbyAPI, kept for the comparisons.
name: home-vlm

networks:
  internal:
    internal: true   # no route out: the model and the app cannot phone home
  edge: {}

x-gpu: &gpu
  devices: ["nvidia.com/gpu=all"]

services:
  # Gemma 4 26B-A4B QAT q4_0 on llama.cpp: the best detector x VLM pair measured (see README).
  vlm:
    build: {context: docker, dockerfile: llamacpp.Dockerfile}
    image: home-vlm-llamacpp:b11869
    <<: *gpu
    networks: [internal]
    volumes: ["/root/.cache/home-vlm/models:/models:ro"]
    command:
      - -m
      - /models/gemma-4-26B_q4_0-it.gguf
      - --mmproj
      - /models/gemma-4-26B-it-mmproj.gguf
      - --alias
      - gemma-4-26b-a4b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --n-gpu-layers
      - "99"
      - --ctx-size
      - "16384"    # 4096 per slot; a label or chat turn stays well under it
      - --parallel
      - "4"        # keeps chat responsive while tracks are being named
      - --jinja
      - --reasoning-budget
      - "0"
    healthcheck:
      test: ["CMD", "curl", "-sf", "localhost:8000/health"]
      interval: 3s
      retries: 60

  # vLLM with Google's QAT int4 (w4a16) weights of the 12B, the earlier default.
  # Image: upstream vllm/vllm-openai v0.32.0 (built 2026-10-18), already on this machine
  # as the clean image the Qwen sandbox verified; this service only reads it.
  vllm:
    image: local/qwen-vllm-clean:v0.32.0
    profiles: [bench]
    <<: *gpu
    networks: [internal]
    environment: {HF_HUB_OFFLINE: "1", VLLM_NO_USAGE_STATS: "1", DO_NOT_TRACK: "1"}
    volumes: ["/root/.cache/home-vlm/models/gemma-4-12b-it-qat-w4a16-ct:/model:ro"]
    command:
      - /model
      - --served-model-name
      - gemma-4-12b-it-qat
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "4"
      - --gpu-memory-utilization
      - "0.5"    # 12 GB: 8.3 GB weights + KV for 4 short requests; leaves room for YOLO

  llamacpp:
    build: {context: docker, dockerfile: llamacpp.Dockerfile}
    image: home-vlm-llamacpp:b11869
    profiles: [bench]
    <<: *gpu
    networks: [internal]
    volumes: ["/root/.cache/home-vlm/models:/models:ro"]
    command:
      - -m
      - /models/gemma-4-12b-it-qat-q4_0.gguf
      - --mmproj
      - /models/mmproj-gemma-4-12b-it-qat-q4_0.gguf
      - --alias
      - gemma-4-12b-it-qat
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --n-gpu-layers
      - "99"
      - --ctx-size
      - "8192"
      - --parallel
      - "1"
      - --jinja
      - --reasoning-budget
      - "0"

  ollama:
    image: ollama/ollama:0.40.10
    profiles: [bench]
    <<: *gpu
    networks: [internal]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Match llama-server: 8192 context, flash attention, f16 KV cache.
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: f16
    volumes:
      - "/root/.cache/home-vlm/models:/models:ro"
      - "/root/.cache/home-vlm/ollama:/root/.ollama"

  sglang:
    image: lmsysorg/sglang:v0.5.22-runtime@sha256:c3d99f078c329a5b2d0c0c02c4237cf8b0dcd1dc6f875a943ae163c1720854cb   # 2026-10-16
    profiles: [bench]
    <<: *gpu
    networks: [internal]
    shm_size: 4g
    environment: {HF_HUB_OFFLINE: "1", DO_NOT_TRACK: "1"}
    # sglang-config.json is the w4a16 config.json plus audio_config.output_proj_dims=640;
    # without it SGLang assumes 1536 and fails on the audio projection's shape.
    volumes:
      - "/root/.cache/home-vlm/models/gemma-4-12b-it-qat-w4a16-ct:/model:ro"
      - "/root/.cache/home-vlm/models/sglang-config.json:/model/config.json:ro"
    entrypoint: ["python3", "-m", "sglang.launch_server"]
    command:
      - --model-path
      - /model
      - --served-model-name
      - gemma-4-12b-it-qat
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --context-length
      - "8192"
      - --max-running-requests
      - "4"
      - --mem-fraction-static
      - "0.5"

  mistralrs:
    image: ghcr.io/ericlbuehler/mistral.rs:cuda130-sm86-0.9.5@sha256:a44f24d17316774bc3f93f39942b64b38db605ebd520c81e53dbc0dffaf8108c   # 2026-10-19
    profiles: [bench]
    <<: *gpu
    networks: [internal]
    environment: {HF_HUB_OFFLINE: "1", DO_NOT_TRACK: "1"}
    volumes: ["/root/.cache/home-vlm/models:/models:ro"]
    # The GGUF has no processor files; those come from the w4a16 folder. By default the KV cache
    # takes all free VRAM and leaves no workspace (every request gets 503), so it is capped.
    command: [serve, -f, /models/gemma-4-12b-it-qat-q4_0.gguf, --mmproj, /models/mmproj-gemma-4-12b-it-qat-q4_0.gguf,
              --tok-model-id, /models/gemma-4-12b-it-qat-w4a16-ct, --host, 0.0.0.0, -p, "8090",
              --max-model-len, "8192", --max-seqs, "4", --kv-cache, 8192tokens, --no-ui]

  tabbyapi:
    build: {context: docker, dockerfile: tabbyapi.Dockerfile}
    image: home-vlm-tabbyapi:9979d01
    profiles: [bench]
    <<: *gpu
    networks: [internal]
    environment: {HF_HUB_OFFLINE: "1", DO_NOT_TRACK: "1"}
    volumes: ["/root/.cache/home-vlm/models:/models:ro"]
    # turboderp/gemma-4-12B-it-exl3 @ 4.00bpw_mul1 (0c0ce0e); cache holds 4 requests of 8192.
    command: [--host, 0.0.0.0, --port, "5000", --disable-auth, "true", --model-dir, /models,
              --model-name, gemma-4-12b-it-exl3-4.0bpw, --max-seq-len, "8192", --cache-size, "32768",
              --max-batch-size, "4", --vision, "true"]

  app:
    build: .
    image: home-vlm-app
    <<: *gpu
    networks: [internal]
    depends_on: {vlm: {condition: service_healthy}}
    environment:
      HVA_SOURCE: ${HVA_SOURCE:-/media/room-office.mp4}
      HVA_VLM_URL: http://vlm:8000
      HVA_VLM_MODEL: gemma-4-26b-a4b
      HVA_YOLO: ${HVA_YOLO:-/models/yoloe-26l-o365.pt}
      HVA_CONF: ${HVA_CONF:-0.3}
      HVA_VLM_WORKERS: ${HVA_VLM_WORKERS:-3}
    volumes:
      - "/root/.cache/home-vlm/models:/models:ro"
      - "/root/.cache/home-vlm/media:/media:ro"
      - "/root/.cache/home-vlm/runs:/runs"

  proxy:
    image: home-vlm-app
    networks: [internal, edge]
    depends_on: [app]
    environment: {TARGET_HOST: app, TARGET_PORT: "8700"}
    command: ["python", "-m", "home_vlm.proxy"]
    ports: ["127.0.0.1:8700:8700"]
