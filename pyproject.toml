[project]
name = "home-vlm-agent"
version = "0.1.0"
description = "YOLO proposes boxes, a local vision-language model says what is in them."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "ultralytics",
  "fastapi",
  "uvicorn",
  "httpx",
  "pillow",
  "opencc-python-reimplemented",
  # ByteTrack needs it; ultralytics would pip-install it at runtime, which fails offline.
  "lap>=0.5.12",
]

[dependency-groups]
dev = ["pytest"]
# Offline scoring of bench results (WordNet); not installed in the app image.
bench = ["nltk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_vlm"]

[tool.uv]
# Only resolve releases that have been public for a week: a poisoned release is
# usually caught and yanked within hours.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
